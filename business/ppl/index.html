<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ppl - SimplyPpl</title>
<style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --ink: #1f2e27;
      --ink-soft: #4b5a52;
      --accent: #24463a;
      --border: #e4e1d8;
      --warn-bg: #fbf3e9;
      --warn-border: #e6cda3;
      --warn-ink: #7a5313;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8vh 6vw 4vh;
    }
    .brand {
      font-size: 1rem;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      margin-bottom: 0.4rem;
      text-decoration: none;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 600;
      color: var(--accent);
      margin: 0 0 2.5rem 0;
      text-align: center;
    }
    .back {
      margin-top: 3rem;
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .back:hover { color: var(--accent); }
    .field {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.8rem;
      margin-bottom: 1.2rem;
    }
    .field label {
      display: block;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 0.8rem;
    }
    .field textarea {
      width: 100%;
      min-height: 110px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--ink);
      resize: vertical;
      background: var(--bg);
    }
    .field button {
      margin-top: 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.6rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    .field button:hover { opacity: 0.92; }
    .field button.secondary {
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid var(--border);
      margin-top: 0.6rem;
    }
    .next-step {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.2rem;
    }
    .next-step.serious {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-ink);
    }
    .hidden { display: none; }
    .records {
      width: 100%;
      max-width: 480px;
    }
    .records h2 {
      font-size: 1.1rem;
      color: var(--ink-soft);
      font-weight: 500;
      margin: 2rem 0 0.8rem 0;
    }
    .record {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 0.7rem;
    }
    .record .date {
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-bottom: 0.3rem;
    }
    .record .situation {
      font-weight: 500;
      margin-bottom: 0.3rem;
    }
    .record .action {
      font-size: 0.95rem;
      color: var(--ink-soft);
    }
    .record .delete {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
    }
    .empty-note {
      color: var(--ink-soft);
      font-size: 0.95rem;
      text-align: center;
      max-width: 480px;
    }
</style>
</head>
<body>
    <a class="brand" href="/">SimplyPpl</a>
    <h1>Ppl</h1>

    <div id="step1" class="field">
      <label for="situation">What happened?</label>
      <textarea id="situation" placeholder="e.g. Bill has been late three times this week."></textarea>
      <button type="button" onclick="showNextStep()">Continue</button>
    </div>

    <div id="step2" class="field hidden">
      <label>Situation</label>
      <div class="next-step" id="situationEcho"></div>
      <label>Next step</label>
      <div class="next-step" id="nextStepText"></div>
      <label for="action">What did you do, or what was agreed?</label>
      <textarea id="action" placeholder="e.g. Spoke with Bill. He'll message ahead if he's running late."></textarea>
      <button type="button" onclick="saveRecord()">Save record</button>
      <button type="button" class="secondary" onclick="resetForm()">Start over</button>
    </div>

    <div class="records">
      <h2>Recent records</h2>
      <div id="recordList"></div>
      <p id="emptyNote" class="empty-note hidden">Nothing recorded yet. Once you save something, it'll show up here.</p>
    </div>

    <a class="back" href="../index.html">&larr; Back to Business</a>

<script>
    // Records are kept in this browser only - nothing is sent anywhere.
    var STORAGE_KEY = "simplyppl_ppl_records";

    // Plain keyword check for situations that need a real person's judgement
    // rather than a generic next step. Kept simple and visible on purpose -
    // no hidden scoring, no AI framing, just an honest boundary check.
    var SERIOUS_WORDS = [
      "police", "assault", "abuse", "harassment", "harassed",
      "discriminat", "injur", "accident", "legal", "lawyer",
      "solicitor", "threat", "weapon", "unsafe", "safety incident"
    ];

    function isSerious(text) {
      var lower = text.toLowerCase();
      for (var i = 0; i < SERIOUS_WORDS.length; i++) {
        if (lower.indexOf(SERIOUS_WORDS[i]) !== -1) return true;
      }
      return false;
    }

    function showNextStep() {
      var situation = document.getElementById("situation").value.trim();
      if (!situation) return;

      document.getElementById("situationEcho").textContent = situation;

      var nextStepBox = document.getElementById("nextStepText");
      if (isSerious(situation)) {
        nextStepBox.textContent = "This sounds like something that needs a professional's judgement - a lawyer, HR advisor, or your industry body. Get their advice before deciding what to do, then come back and record what happened.";
        nextStepBox.classList.add("serious");
      } else {
        nextStepBox.textContent = "Have the conversation. Then come back and record what was said or agreed.";
        nextStepBox.classList.remove("serious");
      }

      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }

    function resetForm() {
      document.getElementById("situation").value = "";
      document.getElementById("action").value = "";
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step1").classList.remove("hidden");
    }

    function loadRecords() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecords(records) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (e) {
        // storage unavailable - records just won't persist this session
      }
    }

    function saveRecord() {
      var situation = document.getElementById("situationEcho").textContent;
      var action = document.getElementById("action").value.trim();

      var records = loadRecords();
      records.unshift({
        date: new Date().toLocaleString(),
        situation: situation,
        action: action
      });
      saveRecords(records);

      resetForm();
      renderRecords();
    }

    function deleteRecord(index) {
      var records = loadRecords();
      records.splice(index, 1);
      saveRecords(records);
      renderRecords();
    }

    function renderRecords() {
      var records = loadRecords();
      var list = document.getElementById("recordList");
      var emptyNote = document.getElementById("emptyNote");
      list.innerHTML = "";

      if (records.length === 0) {
        emptyNote.classList.remove("hidden");
        return;
      }
      emptyNote.classList.add("hidden");

      records.forEach(function (r, i) {
        var div = document.createElement("div");
        div.className = "record";

        var dateDiv = document.createElement("div");
        dateDiv.className = "date";
        dateDiv.textContent = r.date;

        var sitDiv = document.createElement("div");
        sitDiv.className = "situation";
        sitDiv.textContent = r.situation;

        var actionDiv = document.createElement("div");
        actionDiv.className = "action";
        actionDiv.textContent = r.action || "(no action recorded)";

        var delBtn = document.createElement("button");
        delBtn.className = "delete";
        delBtn.type = "button";
        delBtn.textContent = "Delete";
        delBtn.onclick = function () { deleteRecord(i); };

        div.appendChild(dateDiv);
        div.appendChild(sitDiv);
        div.appendChild(actionDiv);
        div.appendChild(delBtn);
        list.appendChild(div);
      });
    }

    renderRecords();
</script>
</body>
</html>
